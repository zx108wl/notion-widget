server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 真实客户端 IP：只信任本机与私网来源（最外层 1Panel 的 OpenResty 会把客户端地址写进 XFF），
    # 还原后的 $remote_addr 再统一覆写 X-Real-IP / X-Forwarded-For 交给 API。
    # API 侧只读 X-Real-IP，因此客户端自带的伪造头不会被采信。
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 默认安全头（工作台与静态资源）。注意 nginx 的 add_header 不继承：
    # 只要 location 自己写了 add_header，这里的默认头就全部失效，
    # 所以嵌入页与静态目录各自重新声明了需要的头。
    # 嵌入页必须允许被 Notion 的 iframe 引用，故 /widget.html 与 /widget/ 不设置
    # X-Frame-Options 与 frame-ancestors。
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    # 工作台是纯自源页面（Vite 产物无内联脚本），收紧到 self；antd 需要内联样式
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location = /widget.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location ^~ /widget/ {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri /widget.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /widgets/manifest.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 服务端插件产物由 api 进程加载，绝不对外暴露（web 镜像整份复制了 dist）
    location ~ ^/widgets/[^/]+/(server\.js|server-chunks/) {
        return 404;
    }

    location ~ ^/widgets/[^/]+/config\.json$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /widgets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆写而不是追加：带进 API 的 IP 必须来自 nginx 还原后的 $remote_addr
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
