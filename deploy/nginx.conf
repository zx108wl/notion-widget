server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 双保险之二：嵌入页与接口响应一律不带 Referer 出去（widget.html 里另有 meta 兜底）
    add_header Referrer-Policy "no-referrer";

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /widget.html {
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer";
        try_files $uri =404;
    }

    location ^~ /widget/ {
        try_files $uri /widget.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /widgets/manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # 服务端插件产物由 api 进程加载，绝不对外暴露（web 镜像整份复制了 dist）
    location ~ ^/widgets/[^/]+/(server\.js|server-chunks/) {
        return 404;
    }

    location ~ ^/widgets/[^/]+/config\.json$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location /widgets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
