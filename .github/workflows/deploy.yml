name: Deploy to 1Panel

on:
  push:
    branches: [main, refactor/ts-ui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notion-widget-production
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Verify build
        run: |
          npm ci
          npm run check

      - name: Validate nginx config
        run: |
          # 用真实 nginx 做语法与 upstream 解析校验：配置写错时不至于部署后才 502
          docker run --rm --add-host api:127.0.0.1 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload project
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Rebuild services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && docker compose up -d --build --remove-orphans"

      - name: Verify deployment health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # 从 web 容器内部走一遍 nginx -> api，确认重建后服务真的可用，避免"部署成功但线上 502"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && bash -s" <<'REMOTE'
          i=0
          while [ "$i" -lt 45 ]; do
            if docker compose exec -T web wget -qO- http://127.0.0.1/api/health >/dev/null 2>&1; then
              echo "部署健康检查通过"
              exit 0
            fi
            i=$((i + 1))
            sleep 2
          done
          echo "部署健康检查失败：90 秒内 /api/health 未就绪"
          docker compose ps
          docker compose logs --tail=80 api
          exit 1
          REMOTE

      - name: Show first-deploy hints
        run: |
          echo "首次部署提示："
          echo "- 主密钥首次启动自动生成，持久化在 widget-key 卷的 /key/master.key。"
          echo "- 管理员账号 admin 的初始密码只在 users 表为空时生成，写入 api 日志与 /key/initial-admin-password。"
          echo "- 查看初始密码（在服务器项目目录执行）：docker compose exec api cat /key/initial-admin-password"
          echo "- 首次登录必须修改密码，改完请删除该密码文件。"
