version: 2
updates:
  # npm 依赖：小版本与补丁合并成一个 PR，减少噪音；主版本单独提
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions 版本（checkout / setup-node 等）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # 基础镜像（Dockerfile.api / Dockerfile.web）
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
