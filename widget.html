<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- 双保险之一：不把嵌入页地址（含查询参数）带到任何外部请求的 Referer 上 -->
    <meta name="referrer" content="no-referrer" />
    <script>
      // 骨架屏主题对齐：在样式生效前读取 URL theme 参数，避免深色主题下骨架闪白
      try {
        const theme = new URLSearchParams(location.search).get("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <style>
      /* 骨架屏：纯静态 HTML+CSS，脚本就绪前即呈现；widget 渲染时 #app 被 innerHTML 整体替换后自动消失 */
      .widget-skeleton {
        --skl-bg: rgb(255 255 255 / 94%);
        --skl-border: rgb(55 53 47 / 14%);
        --skl-bar: rgb(55 53 47 / 8%);
        --skl-shine: rgb(255 255 255 / 55%);
        display: flex;
        flex-direction: column;
        gap: 14px;
        box-sizing: border-box;
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: clamp(22px, 6vw, 38px);
        overflow: hidden;
        border: 1px solid var(--skl-border);
        border-radius: 18px;
        background: var(--skl-bg);
      }
      :root[data-theme="dark"] .widget-skeleton {
        --skl-bg: rgb(31 31 30 / 96%);
        --skl-border: rgb(255 255 255 / 14%);
        --skl-bar: rgb(255 255 255 / 10%);
        --skl-shine: rgb(255 255 255 / 18%);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .widget-skeleton {
          --skl-bg: rgb(31 31 30 / 96%);
          --skl-border: rgb(255 255 255 / 14%);
          --skl-bar: rgb(255 255 255 / 10%);
          --skl-shine: rgb(255 255 255 / 18%);
        }
      }
      .widget-skeleton .skl-bar {
        border-radius: 6px;
        background: linear-gradient(90deg, var(--skl-bar) 25%, var(--skl-shine) 50%, var(--skl-bar) 75%);
        background-size: 200% 100%;
        animation: skl-shimmer 1.2s ease-in-out infinite;
      }
      .widget-skeleton .skl-accent { width: 32px; height: 4px; border-radius: 999px; margin-bottom: 8px; }
      .widget-skeleton .skl-label { width: 64px; height: 13px; }
      .widget-skeleton .skl-main { width: 45%; height: 30px; }
      .widget-skeleton .skl-sub { width: 70%; height: 14px; }
      .widget-skeleton .skl-tail { width: 55%; height: 14px; }
      @keyframes skl-shimmer {
        from { background-position: 200% 0; }
        to { background-position: -200% 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        .widget-skeleton .skl-bar { animation: none; }
      }
    </style>
  </head>
  <body>
    <main id="app" aria-live="polite">
      <div class="widget-skeleton" aria-hidden="true">
        <div class="skl-bar skl-accent"></div>
        <div class="skl-bar skl-label"></div>
        <div class="skl-bar skl-main"></div>
        <div class="skl-bar skl-sub"></div>
        <div class="skl-bar skl-tail"></div>
      </div>
    </main>
    <script type="module" src="/src/widget-entry/main.ts"></script>
  </body>
</html>
