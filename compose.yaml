services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    # .env 可选：不配置也能启动，主密钥与管理员密码会在首次启动时自动生成
    env_file:
      - path: .env
        required: false
    environment:
      # 数据库落在命名卷里：整体替换镜像文件时数据不丢（.env 留在宿主机同理）
      WIDGET_DB_PATH: /data/widget.db
      # 主密钥独立卷：与数据库分开备份，环境变量 WIDGET_DB_KEY 存在时优先
      WIDGET_KEY_PATH: /key/master.key
    volumes:
      - widget-data:/data
      - widget-key:/key
    networks:
      - widget
    # 探活真的走一次 /api/health（内部含数据库查询），库不可用时容器会被标记 unhealthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:80"
    networks:
      - widget
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/widget.html"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  widget:

volumes:
  widget-data:
  widget-key:
