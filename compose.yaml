services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 数据库落在命名卷里：整体替换镜像文件时数据不丢（.env 留在宿主机同理）
      WIDGET_DB_PATH: /data/widget.db
    volumes:
      - widget-data:/data
    networks:
      - widget

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:${WEB_PORT:-18080}:80"
    networks:
      - widget

networks:
  widget:

volumes:
  widget-data:
